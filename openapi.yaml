openapi: 3.1.0
info:
  version: 0.1.0
  title: Streamingestarr APIs
  description: Internal and admin APIs for Streamingestarr. These power the web interface and admin panel
    and may change at any time.
  contact:
    name: Streamingestarr
  license:
    name: MIT
    url: https://en.wikipedia.org/wiki/MIT_License
servers:
- url: http://localhost:8080/api
  description: Localhost port 8080
paths:
  /status:
    get:
      summary: Get the status of the server
      operationId: GetStatus
      tags:
      - Internal
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /emoji:
    get:
      summary: Get list of custom emojis supported in the chat
      operationId: GetCustomEmojiList
      tags:
      - Internal
      - Chat
      responses:
        '200':
          description: List of valid emojis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emojis'
        '500':
          $ref: '#/components/responses/500'
  /chat:
    get:
      summary: Gets a list of chat messages
      operationId: GetChatMessages
      tags:
      - Internal
      - Chat
      parameters:
      - $ref: '#/components/parameters/AccessToken'
      responses:
        '200':
          description: List of chat messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessages'
        '401':
          $ref: '#/components/responses/401'
        '501':
          $ref: '#/components/responses/501'
  /chat/register:
    post:
      summary: Registers an anonymous chat user
      operationId: RegisterAnonymousChatUser
      tags:
      - Internal
      - Chat
      parameters:
      - in: header
        name: X-Forwarded-User
        schema:
          type: string
        required: false
      requestBody:
        description: The display name of the new user
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: Anonymous user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousUser'
        '400':
          $ref: '#/components/responses/400'
    options:
      operationId: RegisterAnonymousChatUserOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204Options'
  /chat/messagevisibility:
    post:
      summary: Update chat message visibility
      operationId: UpdateMessageVisibility
      tags:
      - Internal
      - Chat
      parameters:
      - $ref: '#/components/parameters/AccessToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageVisibilityUpdate'
      responses:
        '200':
          description: Message visibility updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        default:
          $ref: '#/components/responses/Default'
  /chat/users/setenabled:
    post:
      summary: Enable/disable a user
      operationId: UpdateUserEnabled
      tags:
      - Internal
      - Chat
      parameters:
      - $ref: '#/components/parameters/AccessToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: User status has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        default:
          $ref: '#/components/responses/Default'
  /config:
    get:
      summary: Get the web config
      operationId: GetWebConfig
      tags:
      - Internal
      responses:
        '200':
          description: The current web config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebConfig'
        '500':
          $ref: '#/components/responses/500'
  /socialplatforms:
    get:
      summary: Get all social platforms
      operationId: GetAllSocialPlatforms
      tags:
      - Internal
      responses:
        '200':
          description: The list of social platforms
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SocialHandle'
        '500':
          $ref: '#/components/responses/500'
  /video/variants:
    get:
      summary: Get a list of video variants available
      operationId: GetVideoStreamOutputVariants
      tags:
      - Internal
      - Video
      responses:
        '200':
          description: List of available video variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoVariant'
  /ping:
    get:
      summary: Tell the backend you're an active viewer
      operationId: Ping
      tags:
      - Internal
      - Video
      responses:
        '200':
          description: Added as an active viewer
  /metrics/playback:
    post:
      summary: Save video playback metrics for future video health recording
      operationId: ReportPlaybackMetrics
      tags:
      - Internal
      requestBody:
        description: Video metrics to record
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackMetrics'
      responses:
        '200':
          description: Metrics successfully recorded
        '400':
          $ref: '#/components/responses/400'
  /admin/status:
    get:
      summary: Get current inboard broadcaster
      operationId: StatusAdmin
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Gives the status of the system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatus'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: StatusAdminOptions
      x-internal: true
      tags:
      - Objects
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/disconnect:
    get:
      summary: Disconnect inbound stream
      operationId: DisconnectInboundConnection
      tags:
      - Internal
      - Admin
      - Video
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Contains information about disconnection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: DisconnectInboundConnectionOptions
      x-internal: true
      tags:
      - Objects
      - Video
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/serverconfig:
    get:
      summary: Get the current server config
      operationId: GetServerConfig
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Current server config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServerConfig'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetServerConfigOptions
      x-internal: true
      tags:
      - Objects
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/viewersOverTime:
    get:
      summary: Get viewer count over time
      operationId: GetViewersOverTime
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      parameters:
      - in: query
        name: windowStart
        description: Start date in unix time
        schema:
          type: string
      responses:
        '200':
          description: Viewer count over time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimestampedValue'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetViewersOverTimeOptions
      x-internal: true
      tags:
      - Objects
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/viewers:
    get:
      summary: Get active viewers
      operationId: GetActiveViewers
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of active viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Viewer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetActiveViewersOptions
      x-internal: true
      tags:
      - Objects
      - Video
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/hardwarestats:
    get:
      summary: Get the current hardware stats
      operationId: GetHardwareStats
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Current hardware stats
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StreamHealthOverview'
                - $ref: '#/components/schemas/CollectedMetrics'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetHardwareStatsOptions
      x-internal: true
      tags:
      - Objects
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/clients:
    get:
      summary: Get a detailed list of currently connected chat clients
      operationId: GetConnectedChatClients
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of chat clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatClients'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetConnectedChatClientsOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/messages:
    get:
      summary: Get all chat messages for the admin, unfiltered
      operationId: GetChatMessagesAdmin
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of chat messages for the admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessages'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetChatMessagesAdminOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/messagevisibility:
    post:
      summary: Update visibility of chat messages
      operationId: UpdateMessageVisibilityAdmin
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageVisibilityUpdate'
      responses:
        '200':
          description: Messages updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: UpdateMessageVisibilityAdminOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/setenabled:
    post:
      summary: Enable or disable a user
      operationId: UpdateUserEnabledAdmin
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Successfully updated the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: UpdateUserEnabledAdminOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/disabled:
    get:
      summary: Get a list of disabled users
      operationId: GetDisabledUsers
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of disabled users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetDisabledUsersOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/ipbans/create:
    post:
      summary: Ban an IP address
      operationId: BanIPAddress
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AdminConfigValue'
      responses:
        '200':
          description: IP was successfully banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: BanIPAddressOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/ipbans/remove:
    post:
      summary: Remove an IP ban
      operationId: UnbanIPAddress
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConfigValue'
      responses:
        '200':
          description: IP ban was successfully removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: UnbanIPAddressOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/ipbans:
    get:
      summary: Get all banned IP addresses
      operationId: GetIPAddressBans
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of banned IP addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IPAddress'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetIPAddressBansOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/setmoderator:
    post:
      summary: Set moderator status for a user
      operationId: UpdateUserModerator
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                isModerator:
                  type: boolean
      responses:
        '200':
          description: Successfully update the moderator status of the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: UpdateUserModeratorOptions
      x-internal: true
      tags:
      - Objects
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/chat/users/moderators:
    get:
      summary: Get a list of moderator users
      operationId: GetModerators
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of moderator users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetModeratorsOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/logs:
    get:
      summary: Get all logs
      operationId: GetLogs
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of logs
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/Access-Control-Allow-Headers'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminLog'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetLogsOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/logs/warnings:
    get:
      summary: Get warning/error logs
      operationId: GetWarnings
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      responses:
        '200':
          description: List of warnings and errors
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Access-Control-Allow-Credentials:
              $ref: '#/components/headers/Access-Control-Allow-Credentials'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/Access-Control-Allow-Headers'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminLog'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: GetWarningsOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/emoji/upload:
    post:
      summary: Upload custom emoji
      operationId: UploadCustomEmoji
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                data:
                  description: Base 64 encoded image data
                  type: string
      responses:
        '200':
          description: Emoji has been uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: UploadCustomEmojiOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/emoji/delete:
    post:
      summary: Delete custom emoji
      operationId: DeleteCustomEmoji
      tags:
      - Internal
      - Admin
      - Chat
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Emoji has been deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: DeleteCustomEmojiOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      - Chat
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/config/adminpass:
    post:
      summary: Change the current admin password
      operationId: SetAdminPassword
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AdminConfigValue'
      responses:
        '200':
          description: Admin password has been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: SetAdminPasswordOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      responses:
        '204':
          $ref: '#/components/responses/204'
  /admin/config/streamkeys:
    post:
      summary: Set an array of valid stream keys
      operationId: SetStreamKeys
      tags:
      - Internal
      - Admin
      security:
      - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: array
                  items:
                    $ref: '#/components/schemas/StreamKey'
      responses:
        '200':
          description: Stream keys have been updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAPIResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401BasicAuth'
        default:
          $ref: '#/components/responses/Default'
    options:
      operationId: SetStreamKeysOptions
      x-internal: true
      tags:
      - Objects
      - Internal
      - Admin
      responses:
        '204':
          $ref: '#/components/responses/204'
