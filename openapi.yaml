          $ref: '#/components/schemas/AdminWebConfig'
        ffmpegPath:
          type: string
        adminPassword:
          type: string
        socketHostOverride:
          type: string
        webServerIP:
          type: string
        videoCodec:
          type: string
        videoServingEndpoint:
          type: string
        supportedCodecs:
          type: array
          items:
            type: string
        externalActions:
          type: array
          items:
            $ref: '#/components/schemas/ExternalAction'
        forbiddenUsernames:
          type: array
          items:
            type: string
        suggestedUsernames:
          type: array
          items:
            type: string
        streamKeys:
          type: array
          items:
            $ref: '#/components/schemas/StreamKey'
        videoSettings:
          $ref: '#/components/schemas/AdminVideoSettings'
        rtmpServerPort:
          type: integer
        webServerPort:
          type: integer
        chatDisabled:
          type: boolean
        chatJoinMessagesEnabled:
          type: boolean
        chatEstablishedUserMode:
          type: boolean
        disableSearchIndexing:
          type: boolean
        streamKeyOverridden:
          type: boolean
        hideViewerCount:
          type: boolean
    AdminWebConfig:
      type: object
      properties:
        appearanceVariables:
          type: object
          additionalProperties:
            type: string
        version:
          type: string
        welcomeMessage:
          type: string
        offlineMessage:
          type: string
        logo:
          type: string
        name:
          type: string
        extraPageContent:
          type: string
        streamTitle:
          type: string
        customStyles:
          type: string
        customJavascript:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        socialHandles:
          type: array
          items:
            $ref: '#/components/schemas/SocialHandle'
        nsfw:
          type: boolean
    AdminVideoSettings:
      type: object
      properties:
        videoQualityVariants:
          type: array
          items:
            $ref: '#/components/schemas/StreamOutputVariant'
        latencyLevel:
          type: integer
    AdminLog:
      type: object
      properties:
        time:
          type: string
          format: date-time
        message:
          type: string
        level:
          type: string
    AdminConfigValue:
      type: object
      properties:
        value:
          oneOf:
          - type: string
          - type: boolean
          - type: array
            items:
              type: string
          - type: number
  headers:
    Access-Control-Allow-Origin:
      schema:
        type: string
    Access-Control-Allow-Credentials:
      schema:
        type: string
        format: boolean
    Access-Control-Allow-Headers:
      schema:
        type: string
    WWW-Authenticate:
      schema:
        type: string
    X-Content-Type-Options:
      schema:
        type: string
  requestBodies:
    AdminConfigValue:
      description: A single value that is used in the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminConfigValue'
    IndieAuthEndpointForm:
      description: Form submission from IndieAuth
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              code:
                type: string
              redirect_uri:
                type: string
              client_id:
                type: string
              codeVerifier:
                type: string
  responses:
    Default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseAPIResponse'
    '204':
      description: No Content
    204Options:
      description: No Content
      x-internal: true
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseAPIResponse'
    '401':
      description: Unauthorized
      content:
        text/plain:
          schema:
            type: string
    401BasicAuth:
      description: Basic auth failure
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/Access-Control-Allow-Credentials'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
      content:
        text/plain:
          schema:
            type: string
    '403':
      description: Forbidden
    '404':
      description: Not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '501':
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        description: The number of items to skip before starting to collect the result set
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        description: The numbers of items to return
    AccessToken:
      in: query
      name: accessToken
      schema:
        type: string
      required: true
    IndieAuthClientId:
      in: query
      name: client_id
      schema:
        type: string
      required: true
    IndieAuthRedirectURI:
      in: query
      name: redirect_uri
      schema:
        type: string
      required: true
    IndieAuthCodeChallenge:
      in: query
      name: code_challenge
      schema:
        type: string
      required: true
    IndieAuthState:
      in: query
      name: state
      schema:
        type: string
      required: true
    IndieAuthMe:
      in: query
      name: me
      schema:
        type: string
      required: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
tags:
- name: External
  description: These APIs are specifically exposed for building third party applications or tooling. They
    use auth tokens to authenticate and are designed to be stable and reliable.
- name: Internal
