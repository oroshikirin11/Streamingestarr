            $ref: '#/components/schemas/TimestampedValue'
        memory:
          type: array
          items:
            $ref: '#/components/schemas/TimestampedValue'
        cpu:
          type: array
          items:
            $ref: '#/components/schemas/TimestampedValue'
    ChatClient:
      type: object
