        currentBroadcast:
          $ref: '#/components/schemas/CurrentBroadcast'
        health:
          $ref: '#/components/schemas/StreamHealthOverview'
        streamTitle:
          type: string
        versionNumber:
          type: string
        viewerCount:
          type: integer
        overallPeakViewerCount:
          type: integer
        sessionPeakViewerCount:
          type: integer
        online:
          type: boolean
    AdminServerConfig:
      type: object
      properties:
