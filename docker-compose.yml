services:
  streamingestarr:
    build: .
    container_name: streamingestarr
    restart: unless-stopped
    # Plain port mappings — the locks live in the app (login gate, stream
    # keys, SRT/TCP passphrases), and anything you want closed you close in
    # the host firewall (ufw). Every clever per-interface bind we tried
    # here cost a debugging evening.
    ports:
      - "8080:8080"        # web + API (Caddy proxies the public domain here)
      - "1935:1935"        # RTMP ingest
      - "9710:9710/udp"    # SRT ingest
      - "9711:9711"        # TCP ingest (SGR-TS/1 preamble)

    volumes:
      - ./data:/app/data
