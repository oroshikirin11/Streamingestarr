services:
  streamingestarr:
    build: .
    container_name: streamingestarr
    restart: unless-stopped
    # Plain port mappings — the locks live in the app (login gate, stream
    # keys, SRT/TCP passphrases), and anything you want closed you close in
    # the host firewall (ufw). Every clever per-interface bind we tried
    # here cost a debugging evening.
    ports:
      - "8080:8080"        # web + API (Caddy proxies the public domain here)
      - "1935:1935"        # RTMP ingest
      - "9710:9710/udp"    # SRT ingest
      - "9711:9711"        # TCP ingest (SGR-TS/1 preamble)

    volumes:
      - ./data:/app/data
      # TLS on the TCP ingest with Caddy's certificate (docs/deploy-vps.md):
      # mount Caddy's certificate store read-only and point the admin page
      # at /certs/<domain>/<domain>.crt and .key. The container runs as
      # uid 101 — grant it read access with the ACLs from the doc first.
      # - /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory:/certs:ro

    # Cap docker's own json log files — without this they grow forever and
    # quietly eat the disk on a long-running host.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
